[project]
name = "buscaproducto"
version = "0.1.0"
description = "Backend del buscador de productos: agrega ofertas de múltiples fuentes con ayuda de IA."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx[http2]>=0.27",
    "selectolax>=0.3.21",
    "feedparser>=6.0",
    "rapidfuzz>=3.9",
    "pydantic>=2.8",
    "aiosqlite>=0.20",
    "anthropic>=0.40",
    "tenacity>=8.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
]
cosecha = [
    "playwright>=1.47",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["ia: pruebas que llaman a la API de Anthropic (manuales)"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.uv]
package = false
