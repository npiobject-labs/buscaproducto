name: Verificar fuentes (robots, enlaces, fixtures)

# El sandbox de las sesiones no llega a las webs externas: este workflow, desde el runner,
# (1) descarga robots.txt de cada dominio del catalogo -> docs/planificacion/robots.md,
# (2) comprueba cada url_plantilla_busqueda con {q}=mini pc -> docs/planificacion/enlaces.md,
# (3) guarda paginas de resultados reales como fixtures -> app/app/fuentes/fixtures/<slug>/,
# y commitea el resultado en la rama desde la que se lanza.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 1 * *'

permissions:
  contents: write

concurrency:
  group: fuentes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Robots, enlaces y fixtures
        run: python3 tools/verificar_fuentes.py
      - name: Commitear el resultado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/planificacion/robots.md docs/planificacion/enlaces.md app/app/fuentes/fixtures
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Actualizar robots, enlaces y fixtures de las fuentes (workflow)"
            git push
          fi
