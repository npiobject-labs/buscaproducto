name: Desplegar backend en Fly.io

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  desplegar:
    name: Construir y desplegar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # Variable de repositorio opcional; si existe, manda sobre el nombre derivado.
      FLY_APP_VAR: ${{ vars.FLY_APP }}
    steps:
      # Fly es opcional: sin secreto el workflow termina en verde con un aviso.
      - name: Comprobar si Fly esta configurado
        id: fly
        run: |
          if [ -z "${FLY_API_TOKEN}" ]; then
            echo "configurado=false" >> "$GITHUB_OUTPUT"
            echo "Fly no configurado: ver ARRANQUE.md, seccion Fly" >> "$GITHUB_STEP_SUMMARY"
            echo "Fly no configurado: ver ARRANQUE.md, seccion Fly"
          else
            echo "configurado=true" >> "$GITHUB_OUTPUT"
            echo "Token presente (valor oculto)."
          fi

      # Nombre de la app: variable FLY_APP si existe; si no, <repo>-<owner> en
      # minusculas, saneado a [a-z0-9-] y recortado a 30 caracteres.
      - name: Determinar el nombre de la app
        id: app
        if: steps.fly.outputs.configurado == 'true'
        run: |
          if [ -n "${FLY_APP_VAR}" ]; then
            app="${FLY_APP_VAR}"
            origen="variable de repositorio FLY_APP"
          else
            nombre="${GITHUB_REPOSITORY#*/}"
            owner="${GITHUB_REPOSITORY%%/*}"
            app="$(printf '%s-%s' "${nombre}" "${owner}" \
              | tr '[:upper:]' '[:lower:]' \
              | tr -c 'a-z0-9-' '-' \
              | cut -c1-30 \
              | sed 's/-*$//')"
            origen="derivado de ${GITHUB_REPOSITORY}"
          fi
          if [ -z "${app}" ]; then
            echo "::error::No se pudo determinar el nombre de la app de Fly."
            exit 1
          fi
          echo "App de Fly: ${app} (${origen})"
          echo "app=${app}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.fly.outputs.configurado == 'true'
        uses: actions/checkout@v5

      - name: Instalar flyctl
        if: steps.fly.outputs.configurado == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Crear la app si no existe
        if: steps.fly.outputs.configurado == 'true'
        env:
          FLY_APP: ${{ steps.app.outputs.app }}
        run: flyctl apps create "${FLY_APP}" --org desdemovil || true

      # SQLite vive en un volumen: se crea una sola vez, en la region de fly.toml.
      - name: Crear el volumen de datos si no existe
        if: steps.fly.outputs.configurado == 'true'
        env:
          FLY_APP: ${{ steps.app.outputs.app }}
        run: |
          region="$(sed -n 's/^primary_region *= *"\(.*\)"/\1/p' app/fly.toml)"
          if flyctl volumes list --app "${FLY_APP}" --json | grep -q '"name": *"datos"'; then
            echo "Volumen datos ya existe."
          else
            flyctl volumes create datos --app "${FLY_APP}" --region "${region}" --size 1 --yes
          fi

      # Secretos opcionales del proyecto: solo se pasan los que existen en el repo, sin imprimirlos.
      - name: Pasar los secretos del proyecto a Fly
        if: steps.fly.outputs.configurado == 'true'
        env:
          FLY_APP: ${{ steps.app.outputs.app }}
          BP_CLAVE: ${{ secrets.BP_CLAVE }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BP_IA_TOKEN: ${{ secrets.BP_IA_TOKEN }}
          BP_IA_BASE_URL: ${{ vars.BP_IA_BASE_URL }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          presentes=""
          for nombre in BP_CLAVE ANTHROPIC_API_KEY BP_IA_TOKEN BP_IA_BASE_URL SERPER_API_KEY EBAY_CLIENT_ID EBAY_CLIENT_SECRET FIRECRAWL_API_KEY KEEPA_API_KEY APIFY_TOKEN TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID; do
            valor="${!nombre}"
            if [ -n "${valor}" ]; then
              presentes="${presentes} ${nombre}"
              flyctl secrets set "${nombre}=${valor}" --app "${FLY_APP}" --stage > /dev/null
            fi
          done
          echo "Secretos pasados a Fly (solo nombres):${presentes:- ninguno}"
          if [ -z "${BP_CLAVE}" ]; then
            echo "::warning::Falta el secreto BP_CLAVE: /api/v1 respondera 503 hasta que se cree (ver docs/planificacion/HOJA_DE_RUTA.md)."
          fi

      - name: Fijar BUILD_ID con el SHA del commit
        if: steps.fly.outputs.configurado == 'true'
        env:
          FLY_APP: ${{ steps.app.outputs.app }}
        run: flyctl secrets set "BUILD_ID=${GITHUB_SHA}" --app "${FLY_APP}" --stage

      - name: Desplegar en Fly.io
        if: steps.fly.outputs.configurado == 'true'
        env:
          FLY_APP: ${{ steps.app.outputs.app }}
        run: flyctl deploy app --app "${FLY_APP}" --remote-only --ha=false

      - name: Verificar /salud
        if: steps.fly.outputs.configurado == 'true'
        env:
          FLY_APP: ${{ steps.app.outputs.app }}
          SHA: ${{ github.sha }}
        run: |
          url="https://${FLY_APP}.fly.dev/salud"
          echo "Verificando ${url} (se espera build=${SHA})"
          for intento in $(seq 1 10); do
            respuesta="$(curl -fsS --max-time 20 "${url}" || true)"
            echo "Intento ${intento}/10: ${respuesta:-<sin respuesta>}"
            if printf '%s' "${respuesta}" | grep -q "${SHA}"; then
              echo "OK: /salud responde con el build ${SHA}"
              exit 0
            fi
            if [ "${intento}" -lt 10 ]; then
              sleep 15
            fi
          done
          echo "::error::/salud no devolvio el SHA ${SHA} tras 10 intentos (150 s)."
          exit 1

      # Lo que consume docs/holamundo.html desde Pages: cuerpo exacto y CORS.
      - name: Verificar /holamundo
        if: steps.fly.outputs.configurado == 'true'
        env:
          FLY_APP: ${{ steps.app.outputs.app }}
        run: |
          url="https://${FLY_APP}.fly.dev/holamundo"
          cabeceras="$(curl -fsS --max-time 20 -D - -o /tmp/cuerpo "${url}")"
          cuerpo="$(cat /tmp/cuerpo)"
          echo "Respuesta: ${cuerpo}"
          [ "${cuerpo}" = "holamundo" ] || { echo "::error::/holamundo devolvio '${cuerpo}'"; exit 1; }
          printf '%s' "${cabeceras}" | grep -qi '^access-control-allow-origin: \*' \
            || { echo "::error::/holamundo sin cabecera CORS"; exit 1; }
          echo "OK: /holamundo responde 'holamundo' con CORS"

      # Humo de la API: catalogo sembrado y una busqueda en modo enlace de principio a fin.
      - name: Verificar /api/v1 (catalogo y busqueda de humo)
        if: steps.fly.outputs.configurado == 'true'
        env:
          FLY_APP: ${{ steps.app.outputs.app }}
          BP_CLAVE: ${{ secrets.BP_CLAVE }}
        run: |
          if [ -z "${BP_CLAVE}" ]; then
            echo "Sin BP_CLAVE: se omite la prueba de humo de la API."
            exit 0
          fi
          base="https://${FLY_APP}.fly.dev/api/v1"
          n="$(curl -fsS --max-time 30 -H "X-Clave: ${BP_CLAVE}" "${base}/herramientas" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["herramientas"]))')"
          echo "Herramientas en el catalogo: ${n}"
          [ "${n}" -ge 30 ] || { echo "::error::El catalogo tiene ${n} herramientas (< 30)"; exit 1; }
          id="$(curl -fsS --max-time 30 -H "X-Clave: ${BP_CLAVE}" -H 'Content-Type: application/json' \
            -d '{"texto":"mini pc 8gb","precio_min":130,"precio_max":330,"interpretar":false,"fuentes":["idealo","amazon-es","ebay","wallapop"]}' \
            "${base}/busquedas" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
          echo "Busqueda de humo: ${id}"
          for intento in $(seq 1 20); do
            estado="$(curl -fsS --max-time 30 -H "X-Clave: ${BP_CLAVE}" "${base}/busquedas/${id}" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["estado"], d["progreso"]["terminadas"], "/", d["progreso"]["total"])')"
            echo "Intento ${intento}: ${estado}"
            case "${estado}" in terminada*) exit 0;; error*) echo "::error::La busqueda de humo termino en error"; exit 1;; esac
            sleep 3
          done
          echo "::error::La busqueda de humo no termino en 60 s"; exit 1

      - name: Resumen del despliegue
        if: success() && steps.fly.outputs.configurado == 'true'
        env:
          FLY_APP: ${{ steps.app.outputs.app }}
        run: |
          region="$(sed -n 's/^primary_region *= *"\(.*\)"/\1/p' app/fly.toml)"
          {
            echo "### Backend desplegado en Fly.io"
            echo ""
            echo "- App: \`${FLY_APP}\` (region \`${region}\`)"
            echo "- URL: https://${FLY_APP}.fly.dev/"
            echo "- Salud: https://${FLY_APP}.fly.dev/salud"
            echo "- Hola mundo: https://${FLY_APP}.fly.dev/holamundo"
            echo "- Comprobacion desde Pages: https://${GITHUB_REPOSITORY%%/*}.github.io/${GITHUB_REPOSITORY#*/}/holamundo.html"
            echo "- API: https://${FLY_APP}.fly.dev/api/v1/salud-bd (cabecera X-Clave)"
            echo "- Build (SHA): \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
